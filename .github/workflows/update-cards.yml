name: Update cards

# Runs daily: prices are refreshed when they're over a week old, and new cards are rendered and
# uploaded to Cloudflare KV. KV's free plan allows 1,000 writes a day, so the first fill (~2,900
# images) takes about 3 runs. Nothing is stored on GitHub: scans are downloaded, rendered and
# uploaded in memory on the runner.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      refresh_prices:
        description: "Refresh prices even if they're less than a week old"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
      # Card settings (see cards.py). Changing a look setting re-renders every card over the next few runs.
      POKEMON_MIN_PRICE: "50"
      DARKNESS: "1.3"
      BACKGROUND: "black"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install Pillow==11.3.0
      - run: python build.py ${{ inputs.refresh_prices && '--refresh-prices' || '' }}
